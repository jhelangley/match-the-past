<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Past...in Order</title>
</head>
<body>
    <div id="instructions">
        <header>How to play:</header>
            <ul>
               <li>You will be given a number of events with a small description about each one</li>
               <li>Your role is to order these into chronological order</li>
               <li>Each level will increase the number of dates you have to order</li>
            </ul>
    </div>
    <div id="game-buttons">
        <button type="button" id="start-btn">Start game</button>
        <button type="button" id="resume-btn">Resume game</button>
    </div>
</body>
</html>
