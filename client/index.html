<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="scripts.js"></script>
    <title>The Past...in Order</title>
</head>
<body>
    <h1 id="play-title">The Past...in Order</h1>
    <div id="game-window"></div>
    <div id="finish-btn">
        <button id="check-btn">Check answers</button>
        <button id="reset-btn">Reset</button>
        <p id="success"></p>
    </div>

    <template id="event-card-template">
        <div class="event-card">
            <h3 class="event-name"></h3>
            <p class="event-description"></p>
            <p class="date hidden"></p>
            <button class="move-btn up">Move up</button>
            <button class="move-btn down">Move down</button>
        </div>
    </template>
    
</body>
</html>
