<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script defer src="scripts.js"></script>
    <title>The Past...in Order</title>
</head>
<body>
    <h1>The Past...in Order</h1>
    <p>card testing</p>
    <div id="game-window"></div>
    <ol id="correct-answer"></ol>
    <button id="check-btn">Check answers</button>
    <button id="reset-btn">Reset</button>
    <p id="success"></p>

<template id="event-card-template">

        <button class="move-btn down">Move down</button>
    </div>
</template>
